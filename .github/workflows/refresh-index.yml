name: Refresh recipe index

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build recipe index
        run: node scripts/build-index.mjs

      - name: Commit data if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore(data): refresh recipe index"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to data/ — skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN never triggers other workflows, so the
      # Pages deploy must be dispatched explicitly for refreshed data to ship.
      - name: Deploy refreshed data to Pages
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
